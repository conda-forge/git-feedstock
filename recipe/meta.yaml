{% set version = "2.51.3" %}

package:
  name: git
  version: {{ version }}

source:
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-{{ version }}.tar.gz  # [not win]
    folder: code  # [not win]
    sha256: 6a1efa88d419a3cfe0bed3392e40a35c20a2109cec71cbe09d27026aa606bddc  # [not win]
    patches:   # [not win]
      - 0001-macOS-Do-not-use-the-system-Wish-urgh.patch  # [not win]
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-manpages-{{ version }}.tar.gz  # [not win]
    folder: manpages  # [not win]
    sha256: c5143c5ee8a70182bc29e0cb4b6de00eb743913dcd5579a752125503095f0aad  # [not win]
  - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-htmldocs-{{ version }}.tar.gz  # [not win]
    folder: htmldocs  # [not win]
    sha256: 3faa66ef277b97b786e575d0b69b47162e0f8bf789a743132c5f6526306646e7  # [not win]

build:
  number: 0
  # Git for Windows (PortableGit) has not published a release matching this version yet.
  skip: true  # [win]
  # git hardcodes paths to external utilities (e.g. curl)
  detect_binary_files_with_prefix: true
  ignore_run_exports_from:
    - perl 5.*  # [unix]

requirements:
  build:
    - {{ stdlib('c') }}    # [unix]
    - {{ compiler('c') }}  # [unix]
    - {{ compiler('rust') }}  # [unix]
    - {{ stdlib("c") }}    # [unix]
    - autoconf  # [unix]
    - make      # [unix]
    - tk        # [unix]
    - gettext-tools   # [unix]
  host:
    - libintl-devel  # [osx]
    - libcurl        # [unix]
    - expat          # [unix]
    - libiconv       # [unix]
    - openssl        # [unix]
    - pcre2          # [unix]
    - perl 5.*       # [unix]
    - zlib           # [unix]
  run:
    # Without the explicit dependency on curl, it seems
    # that linux_64 fails on the symbol lookup for curl_global_sslset
    - perl 5.*  # [unix]

test:
  commands:
    # Verify git location.
    - test -f $PREFIX/bin/git                               # [unix]
    - test -f $PREFIX/bin/gitk                              # [unix]
    - test -f $PREFIX/bin/git-credential-osxkeychain        # [osx]
    - if not exist %LIBRARY_PREFIX%\\bin\\git.exe exit 1    # [win]

    # Run git commands.
    - git --version  # [unix]
    - git clone https://github.com/conda-forge/git-feedstock  # [unix]
    - '"%LIBRARY_PREFIX%\bin\git.exe" version --build-options'  # [win]
    - '"%LIBRARY_PREFIX%\bin\git.exe" clone https://github.com/conda-forge/git-feedstock'  # [win]
    - '"%LIBRARY_PREFIX%\bin\git.exe" version --build-options | findstr /c:"cpu: aarch64"'  # [win and arm64]
    - '"%LIBRARY_PREFIX%\usr\bin\bash.exe" --version'  # [win]
    - '"%LIBRARY_PREFIX%\usr\bin\cygpath.exe" -w /'  # [win]

    # Git credential commands
    - git-credential-osxkeychain 2>&1 | grep -q usage  # [osx]

    # test completions
    - bash $PREFIX/share/bash-completion/completions/git  # [unix]

    # test subtree presence
    - test -f $PREFIX/libexec/git-core/git-subtree  # [unix]

    # confirm toplevel manpage
    - test -f $PREFIX/man/man1/git.1  # [not win]
    - test -f $PREFIX/share/man/man1/git.1  # [osx]

    # confirm toplevel html doc page
    - test -f $PREFIX/share/doc/git/index.html  # [not win]

about:
  home: https://git-scm.com/
  license: GPL-2.0-or-later and LGPL-2.1-or-later
  license_file:
    - code/COPYING  # [not win]
    - COPYING  # [win]
  summary: distributed version control system

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - scopatz
    - ocefpaf
    - djsutherland
    - ytausch
